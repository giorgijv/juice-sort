<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juice Sort</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <header class="topbar">
      <h1 class="logo">🧃 Juice Sort</h1>
      <div class="stats">
        <span id="movesLabel">Moves: 0</span>
        <span id="difficultyLabel"></span>
      </div>
    </header>

    <!-- Difficulty select screen -->
    <section id="menuScreen" class="screen">
      <h2>Choose your difficulty</h2>
      <div class="menu-cards">
        <button class="diff-card" data-diff="easy">
          <span class="diff-title">Easy</span>
          <span class="diff-desc">6 colors, small bottles (4), 4 per side</span>
        </button>
        <button class="diff-card" data-diff="medium">
          <span class="diff-title">Medium</span>
          <span class="diff-desc">9 colors, bigger bottles (5), 6 per side</span>
        </button>
        <button class="diff-card" data-diff="hard">
          <span class="diff-title">Hard</span>
          <span class="diff-desc">13 colors, tall bottles (6), 8 per side</span>
        </button>
        <button class="diff-card" data-diff="expert">
          <span class="diff-title">Expert</span>
          <span class="diff-desc">16 colors, tall bottles (6), 10 per side, two goals</span>
        </button>
      </div>
    </section>

    <!-- Game screen: goal bottle(s) stand in the middle, the small bottles
         are split into grids either side of them. -->
    <section id="gameScreen" class="screen hidden">
      <div class="board">
        <div id="leftGrid" class="side-grid"></div>
        <div id="longBottleWrap" class="goal-column"></div>
        <div id="rightGrid" class="side-grid"></div>
      </div>

      <div class="controls">
        <button id="undoBtn">↶ Undo</button>
        <button id="restartBtn">⟲ Restart</button>
        <button id="newGameBtn">🔀 New Game</button>
        <button id="menuBtn">☰ Menu</button>
      </div>
    </section>

    <!-- Win overlay -->
    <div id="winOverlay" class="overlay hidden">
      <div class="win-card">
        <h2>🎉 Sorted!</h2>
        <p id="winStats"></p>
        <button id="winNextBtn">Play Again</button>
        <button id="winMenuBtn">Choose Difficulty</button>
      </div>
    </div>

    <footer class="site-footer">Game made by Giorgi Jvarsheishvili &middot; <a href="farm-game/index.html">🚜 Play Farm Life</a></footer>

  </div>

  <!-- Overlay the pouring liquid stream is drawn into, above the board. -->
  <svg id="pourLayer" aria-hidden="true"></svg>

<script src="script.js"></script>
</body>
</html>
